declares: contract
id: nf-core/quast@5.3.0
nf_process: QUAST
nf_include: modules/nf-core/quast/main
consumes:
- name: consensus
  type_id: assembly.fasta
  state_required_conventional: []
  state_preferred: []
  prefer: []
- name: fasta
  type_id: genome.fasta
  state_required_conventional: []
  state_preferred: []
  prefer: []
  required: false
- name: gff
  type_id: annotation.gff
  state_required_conventional: []
  state_preferred: []
  prefer: []
  required: false
produces:
- name: results
  type_id: qc.report::assembly
  format:
  - folder
- name: tsv
  type_id: qc.report::assembly
  format:
  - tsv
- name: misassemblies
  type_id: qc.report::assembly
  format:
  - tsv
  produced_when:
    given.fasta: present
- name: unaligned
  type_id: qc.report::assembly
  format:
  - tsv
  produced_when:
    given.fasta: present
params:
- name: prefix
  because: main.nf reads task.ext.prefix and falls back to meta.id, so it has no default;
    a value names the output directory and report files.
  via: ext
  key: prefix
roles:
- qc_per_sample
priority_because: Neutral priority; the approved competition answer requests no selection
  rule.
container: community.wave.seqera.io/library/quast:5.3.0--755a216045b6dbdd
nf_inputs:
- ports:
  - consensus
- ports:
  - fasta
  absent: 2
- ports:
  - gff
  absent: 2
ext_args:
  because: main.nf defaults task.ext.args to an empty string. No additional command-line
    options are required; reference, features, threads, output directory and assemblies
    are already wired by the module.
constraints:
- when:
    given.gff: present
  requires:
  - fasta
  because: QUAST silently ignores GFF features without a reference; reject this ineffective
    input combination up front.
  cite: 'User-reported QUAST 5.3.0 run: --features without -r exits 0 but produces
    no genome_stats.'
provenance:
  source: forge
  drafted_by: ai
  approved_by: unknown
  approved_at: '2026-11-07'
